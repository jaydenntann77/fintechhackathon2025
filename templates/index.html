<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blockchain Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .block {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .block h4 {
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Simple Blockchain Dashboard</h1>
    <button onclick="fetchBlockchain()">Show Blockchain</button>
    <button onclick="validateBlockchain()">Validate Blockchain</button>
    <div id="blockchain"></div>
    <form id="addBlockForm">
        <h3>Add a KYC Block</h3>
        <label for="customer_id">Customer ID:</label>
        <input type="text" id="customer_id" placeholder="Enter customer ID" required><br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter name" required><br><br>
        <label for="verified">Verified:</label>
        <input type="checkbox" id="verified"><br><br>
        <button type="submit">Add Block</button>
    </form>
    

    <script>
        // Fetch and display the blockchain
        async function fetchBlockchain() {
            const response = await fetch('/blockchain');
            const data = await response.json();
            const blockchainDiv = document.getElementById('blockchain');
            blockchainDiv.innerHTML = '';
            data.chain.forEach(block => {
                const blockDiv = document.createElement('div');
                blockDiv.className = 'block';
                blockDiv.innerHTML = `
                    <h4>Block ${block.index}</h4>
                    <p><strong>Timestamp:</strong> ${block.timestamp}</p>
                    <p><strong>Data:</strong> ${JSON.stringify(block.data)}</p>
                    <p><strong>Hash:</strong> ${block.hash}</p>
                    <p><strong>Previous Hash:</strong> ${block.previous_hash}</p>
                `;
                blockchainDiv.appendChild(blockDiv);
            });
        }
    
        // Handle form submission to add a new block
        document.getElementById('addBlockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const customerID = document.getElementById('customer_id').value;
            const name = document.getElementById('name').value;
            const verified = document.getElementById('verified').checked;
    
            const data = {
                customer_id: customerID,
                name: name,
                verified: verified,
                verification_date: new Date().toISOString()
            };
    
            const response = await fetch('/add_block', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
    
            if (response.ok) {
                alert('Block added successfully!');
                fetchBlockchain(); // Refresh the blockchain display
            } else {
                alert('Failed to add block. Please check your input.');
            }
        });
    
        // Initial fetch of blockchain data
        fetchBlockchain();
    </script>
    
</body>
</html>
